[project]
# Имя проекта — только латиница и дефисы
name = "rag-legal-v2"

# Версия проекта — начинаем с 0.1.0
version = "0.1.0"

# Минимальная версия Python
requires-python = ">=3.11"

# Список зависимостей — библиотеки, которые нужны проекту
dependencies = [
    "openai>=2.0,<3",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
    "httpx[socks]>=0.27.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.30.0",
    "redis[asyncio]>=5.0.0",
    "arize-phoenix-otel>=0.7.0",
    "openinference-instrumentation-openai>=0.1.0",
    "structlog>=24.0.0",
    "slowapi>=0.1.10",
    "aiofiles>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "tiktoken>=0.9.0",
    "aiogram>=3.7,<4",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "telegramify-markdown>=0.1.0",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tqdm>=4.66",
    "sentence-transformers>=3.0",
]


[dependency-groups]
# Зависимости только для тестов — не попадают в прод
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pyyaml>=6.0.0",
    "testcontainers[postgres]>=4.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Говорим pytest: все async-тесты запускать автоматически
asyncio_mode = "auto"
pythonpath = ["."]
